apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-server
  namespace: kung-fu-chess
  labels:
    app.kubernetes.io/name: game-server
    app.kubernetes.io/component: game-server
    app.kubernetes.io/part-of: kung-fu-chess
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: game-server
      app.kubernetes.io/component: game-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: game-server
        app.kubernetes.io/component: game-server
        app.kubernetes.io/part-of: kung-fu-chess
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: game-server
          image: kungfu-chess/game-server
          imagePullPolicy: IfNotPresent
          ports:
            - name: websocket
              containerPort: 8766
            - name: allocation
              containerPort: 8767
            - name: health
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: game-server-config
          env:
            - name: KFC_INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kung-fu-chess-secrets
                  key: KFC_INTERNAL_SERVICE_TOKEN
            - name: KFC_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: KFC_POSTGRES_PASSWORD
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
