apiVersion: v1
kind: Service
metadata:
  name: game-server-service
  namespace: kung-fu-chess
  labels:
    app.kubernetes.io/name: game-server
    app.kubernetes.io/component: game-server
    app.kubernetes.io/part-of: kung-fu-chess
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: game-server
    app.kubernetes.io/component: game-server
  ports:
    - name: websocket
      port: 8766
      targetPort: websocket
      protocol: TCP
    - name: allocation
      port: 8767
      targetPort: allocation
      protocol: TCP
    - name: health
      port: 8081
      targetPort: health
      protocol: TCP
