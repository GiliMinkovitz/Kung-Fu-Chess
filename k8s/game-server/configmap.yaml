apiVersion: v1
kind: ConfigMap
metadata:
  name: game-server-config
  namespace: kung-fu-chess
  labels:
    app.kubernetes.io/name: game-server
    app.kubernetes.io/component: game-server
    app.kubernetes.io/part-of: kung-fu-chess
data:
  KFC_BIND_ADDRESS: "0.0.0.0"
  KFC_SERVER_ID: "game-server-k8s"
  KFC_REGION: "k8s"
  KFC_GAME_PORT: "8766"
  KFC_GAME_INTERNAL_PORT: "8767"
  KFC_GAME_HEALTH_PORT: "8081"
  KFC_GAME_MAX_CLIENTS: "8"
  KFC_GAME_ENDPOINT: "ws://localhost:8766"
  KFC_ALLOCATION_ENDPOINT: "http://game-server-service:8767/allocate"
  KFC_DATABASE_TYPE: "postgres"
  KFC_POSTGRES_HOST: "postgres-service"
  KFC_POSTGRES_PORT: "5432"
  KFC_POSTGRES_DB: "kfc"
  KFC_POSTGRES_USER: "kfc"
  KFC_REDIS_ENABLED: "true"
  KFC_REDIS_HOST: "redis-service"
  KFC_REDIS_PORT: "6379"
  KFC_DIAGNOSTICS: "true"
