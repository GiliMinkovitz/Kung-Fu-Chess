apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: kung-fu-chess
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: kung-fu-chess
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: gateway
  ports:
    - name: websocket
      port: 8765
      targetPort: websocket
      protocol: TCP
    - name: health
      port: 8080
      targetPort: health
      protocol: TCP
    - name: internal
      port: 8771
      targetPort: internal
      protocol: TCP
