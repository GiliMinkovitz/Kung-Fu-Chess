apiVersion: apps/v1
kind: Deployment
metadata:
  name: matchmaker
  namespace: kung-fu-chess
  labels:
    app.kubernetes.io/name: matchmaker
    app.kubernetes.io/component: matchmaker
    app.kubernetes.io/part-of: kung-fu-chess
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: matchmaker
      app.kubernetes.io/component: matchmaker
    template:
      metadata:
        labels:
          app.kubernetes.io/name: matchmaker
          app.kubernetes.io/component: matchmaker
          app.kubernetes.io/part-of: kung-fu-chess
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "8772"
          prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: matchmaker
          image: kungfu-chess/matchmaker
          imagePullPolicy: IfNotPresent
          ports:
            - name: api
              containerPort: 8770
            - name: health
              containerPort: 8772
          envFrom:
            - configMapRef:
                name: matchmaker-config
          env:
            - name: KFC_INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kung-fu-chess-secrets
                  key: KFC_INTERNAL_SERVICE_TOKEN
            - name: KFC_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: KFC_POSTGRES_PASSWORD
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
