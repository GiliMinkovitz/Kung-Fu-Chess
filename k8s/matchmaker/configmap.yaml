apiVersion: v1
kind: ConfigMap
metadata:
  name: matchmaker-config
  namespace: kung-fu-chess
  labels:
    app.kubernetes.io/name: matchmaker
    app.kubernetes.io/component: matchmaker
    app.kubernetes.io/part-of: kung-fu-chess
data:
  KFC_BIND_ADDRESS: "0.0.0.0"
  KFC_SERVER_ID: "matchmaker-k8s"
  KFC_REGION: "k8s"
  KFC_MATCHMAKER_PORT: "8770"
  KFC_MATCHMAKER_HEALTH_PORT: "8772"
  KFC_GATEWAY_NOTIFICATION_ENDPOINT: "http://gateway-service:8771"
  KFC_DATABASE_TYPE: "postgres"
  KFC_POSTGRES_HOST: "postgres-service"
  KFC_POSTGRES_PORT: "5432"
  KFC_POSTGRES_DB: "kfc"
  KFC_POSTGRES_USER: "kfc"
  KFC_REDIS_ENABLED: "true"
  KFC_REDIS_HOST: "redis-service"
  KFC_REDIS_PORT: "6379"
  KFC_ALLOCATION_TIMEOUT_MS: "2000"
  KFC_ALLOCATION_RETRY_COUNT: "3"
  KFC_GAME_SERVER_TTL_SECONDS: "10"
  KFC_DIAGNOSTICS: "true"
